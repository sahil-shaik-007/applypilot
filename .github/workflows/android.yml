# ApplyPilot Android: debug APK on every relevant push, plus a signed release AAB when the
# Play upload-key secrets exist. Docs: docs/ANDROID.md
#
# Secrets (Settings -> Secrets and variables -> Actions), all optional:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
name: Android

on:
  push:
    branches: [main, 'ci/android-*']
    tags: ['v*']
    paths:
      - 'web/**'
      - 'electron/data/profile-schema.json'
      - 'build/icon.png'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'web/client/**'
      - 'web/shared/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  JAVA_VERSION: '21'
  CLIENT_DIR: web/client

jobs:
  build:
    name: Build (debug APK + release AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      # Strictly increasing versionCode for Play uploads (overrides the package.json-derived one).
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships an Android SDK; make sure the API 36 platform + build-tools are present.
      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Install web client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      - name: Build web client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build

      - name: Capacitor sync
        working-directory: ${{ env.CLIENT_DIR }}
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: ${{ env.CLIENT_DIR }}/android
        # gradlew is committed from Windows without the executable bit (exit code 126 otherwise).
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: applypilot-debug-apk
          path: ${{ env.CLIENT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Decode upload keystore
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Bundle signed release AAB
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ env.CLIENT_DIR }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB signature
        if: env.HAS_SIGNING == 'true'
        working-directory: ${{ env.CLIENT_DIR }}/android
        run: jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tail -n 2

      - name: Upload release AAB + R8 mapping
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: applypilot-release-aab
          path: |
            ${{ env.CLIENT_DIR }}/android/app/build/outputs/bundle/release/*.aab
            ${{ env.CLIENT_DIR }}/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Summary
        if: always()
        run: |
          {
            echo "### ApplyPilot Android"
            echo "- Debug APK: \`applypilot-debug-apk\` artifact"
            if [ "$HAS_SIGNING" = "true" ]; then echo "- Signed release AAB: \`applypilot-release-aab\` artifact (versionCode $ANDROID_VERSION_CODE)"; else echo "- Release AAB skipped: signing secrets not configured"; fi
          } >> "$GITHUB_STEP_SUMMARY"
