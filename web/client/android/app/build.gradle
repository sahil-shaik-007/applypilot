apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// ---------------------------------------------------------------------------
// Version: versionName comes from web/client/package.json "version".
// versionCode = major*10000 + minor*100 + patch, unless overridden by the
// ANDROID_VERSION_CODE env var / -PversionCode=... (CI uses this so every
// Play upload gets a strictly increasing code).
// ---------------------------------------------------------------------------
def pkgJson = new JsonSlurper().parse(file('../../package.json'))
def appVersionName = (pkgJson.version ?: '1.0.0').toString()
def semver = appVersionName.tokenize('-')[0].tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
while (semver.size() < 3) semver << 0
def derivedVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]
def overrideVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: project.findProperty('versionCode'))?.toString()
def appVersionCode = overrideVersionCode?.isInteger() ? overrideVersionCode.toInteger() : derivedVersionCode

// ---------------------------------------------------------------------------
// Release signing: values come ONLY from env vars or Gradle properties
// (~/.gradle/gradle.properties or -P...). Nothing secret is committed.
//   ANDROID_KEYSTORE_PATH / applypilot.keystore.path
//   ANDROID_KEYSTORE_PASSWORD / applypilot.keystore.password
//   ANDROID_KEY_ALIAS / applypilot.key.alias
//   ANDROID_KEY_PASSWORD / applypilot.key.password
// If no keystore is configured, release builds are produced UNSIGNED.
// ---------------------------------------------------------------------------
def signingValue = { String envName, String propName ->
    def v = System.getenv(envName)
    if (v == null || v.isEmpty()) v = project.findProperty(propName)?.toString()
    return (v == null || v.isEmpty()) ? null : v
}
def releaseKeystorePath = signingValue('ANDROID_KEYSTORE_PATH', 'applypilot.keystore.path')
def hasReleaseSigning = releaseKeystorePath != null && file(releaseKeystorePath).exists()

// Host used for verified https App Links (needs /.well-known/assetlinks.json there).
def appLinkHost = (project.findProperty('applypilot.appLinkHost') ?: 'app.applypilot.app').toString()

android {
    namespace = "com.applypilot.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.applypilot.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [appLinkHost: appLinkHost]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'applypilot.keystore.password')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'applypilot.key.alias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'applypilot.key.password')
            }
        }
    }

    buildTypes {
        debug {
            // Debug builds get a debug-only network security config (src/debug/res/xml)
            // that allows cleartext to localhost / 10.0.2.2 for the local dev server.
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        // Release builds must not be blocked by lint warnings coming from node_modules plugins.
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
        // Required by @capacitor/background-runner (ships its JS engine as an .aar)
        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') } && !hasReleaseSigning) {
        logger.warn("ApplyPilot: no release keystore configured (ANDROID_KEYSTORE_PATH). Release output will be UNSIGNED.")
    }
}
