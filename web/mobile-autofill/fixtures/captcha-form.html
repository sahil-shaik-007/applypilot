<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply</title>
<style>body{font:15px system-ui;padding:16px}.field-wrapper{margin:10px 0}label{display:block}input{width:100%;padding:8px;box-sizing:border-box}</style></head>
<body><form id="application-form" data-thanks>
  <div class="field-wrapper"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field-wrapper"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field-wrapper"><label for="email">Email *</label><input id="email" type="email" name="email" required></div>
  <div class="field-wrapper"><label for="resume">Resume *</label><input id="resume" type="file" name="resume" required></div>
  <div class="g-recaptcha"><iframe title="reCAPTCHA" src="/recaptcha/api2/anchor?k=test&amp;size=normal" width="304" height="78" style="border:0"></iframe></div>
  <button type="submit">Submit application</button>
</form><script src="/widgets.js"></script></body></html>
