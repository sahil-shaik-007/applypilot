<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Application for Senior Software Engineer at Acme</title>
<style>
  body{font:15px system-ui,sans-serif;margin:0;padding:16px;max-width:640px}
  .field-wrapper,.select__container{margin:14px 0;display:block}
  label{display:block;font-weight:600;margin-bottom:4px}
  input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;box-sizing:border-box;padding:8px;font:inherit}
  .select__control{border:1px solid #999;padding:6px;display:flex;cursor:pointer}
  .select__value-container{display:flex;flex:1;gap:6px;align-items:center}
  .select__control input{border:0;outline:0;min-width:60px;width:auto;padding:2px}
  .select__menu{border:1px solid #ccc;background:#fff}.select__option{padding:6px}
  .file-upload{border:1px dashed #999;padding:10px}
</style></head>
<body>
<h1>Senior Software Engineer</h1>
<p>Acme · San Francisco, CA (Hybrid)</p>
<form id="application-form" data-thanks action="/submit" method="post">
  <div class="field-wrapper"><label for="first_name">First Name<span>*</span></label><input id="first_name" name="first_name" required autocomplete="given-name"></div>
  <div class="field-wrapper"><label for="last_name">Last Name<span>*</span></label><input id="last_name" name="last_name" required></div>
  <div class="field-wrapper"><label for="email">Email<span>*</span></label><input id="email" name="email" type="email" required></div>
  <div class="field-wrapper"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>

  <div class="select__container"><label for="candidate-location">Location (City)<span>*</span></label>
    <div class="select__control" data-combo data-async="1" data-menu="loc-menu" data-options='["San Francisco, California, United States","San Diego, California, United States","Santa Fe, New Mexico, United States"]'>
      <div class="select__value-container"><div class="select__placeholder">Start typing...</div>
        <input id="candidate-location" role="combobox" aria-autocomplete="list" aria-required="true" aria-controls="loc-menu" aria-expanded="false"></div></div>
    <div class="select__menu" role="listbox" id="loc-menu" hidden></div><input type="hidden" name="location"></div>

  <div class="field-wrapper"><div class="file-upload"><label for="resume">Resume/CV<span>*</span></label>
    <input id="resume" name="resume" type="file" required accept=".pdf,.doc,.docx,.txt,.rtf"></div></div>
  <div class="field-wrapper"><div class="file-upload" id="cover-group"><label for="cover_letter">Cover Letter</label>
    <input id="cover_letter" name="cover_letter" type="file" accept=".pdf,.doc,.docx">
    <button type="button" id="enter-manually">Enter manually</button></div></div>

  <div class="field-wrapper"><label for="question_1">LinkedIn Profile</label><input id="question_1" name="question_1"></div>
  <div class="field-wrapper"><label for="question_2">Why do you want to work at Acme?<span>*</span></label><textarea id="question_2" name="question_2" required></textarea></div>

  <div class="select__container"><label for="question_3">Are you legally authorized to work in the United States?<span>*</span></label>
    <div class="select__control" data-combo data-menu="q3-menu" data-options='["Yes","No"]'>
      <div class="select__value-container"><div class="select__placeholder">Select...</div>
        <input id="question_3" role="combobox" aria-autocomplete="list" aria-required="true" aria-controls="q3-menu" aria-expanded="false"></div></div>
    <div class="select__menu" role="listbox" id="q3-menu" hidden></div><input type="hidden" name="question_3"></div>

  <div class="select__container"><label for="question_4">Will you now or in the future require sponsorship for employment visa status?<span>*</span></label>
    <div class="select__control" data-combo data-menu="q4-menu" data-options='["Yes","No"]'>
      <div class="select__value-container"><div class="select__placeholder">Select...</div>
        <input id="question_4" role="combobox" aria-autocomplete="list" aria-required="true" aria-controls="q4-menu" aria-expanded="false"></div></div>
    <div class="select__menu" role="listbox" id="q4-menu" hidden></div><input type="hidden" name="question_4"></div>

  <div class="field-wrapper"><label for="question_5">What is the secret word from our onboarding email?<span>*</span></label><input id="question_5" name="question_5" required></div>
  <div class="field-wrapper"><label for="question_6">What is your favorite programming language and why?</label><textarea id="question_6" name="question_6"></textarea></div>

  <div class="field-wrapper"><label for="gender">Gender</label>
    <select id="gender" name="gender"><option value="">Select...</option><option value="1">Male</option><option value="2">Female</option><option value="3">Decline To Self Identify</option></select></div>
  <div class="field-wrapper"><label for="veteran">Veteran Status</label>
    <select id="veteran" name="veteran"><option value="">Select...</option><option value="1">I am not a protected veteran</option><option value="2">I identify as one or more of the classifications of protected veteran</option><option value="3">I don't wish to answer</option></select></div>
  <div class="field-wrapper"><label for="pw">Create a candidate account password</label><input id="pw" name="password" type="password"></div>
  <div class="field-wrapper"><label><input type="checkbox" id="consent" name="consent" required> I agree to the processing of my data in accordance with the privacy policy *</label></div>
  <button type="submit">Submit application</button>
</form>
<script>
  document.getElementById('enter-manually').addEventListener('click', function () {
    var ta = document.createElement('textarea'); ta.id = 'cover_letter_text'; ta.name = 'cover_letter_text';
    document.getElementById('cover-group').appendChild(ta);
  });
</script>
<script src="/widgets.js"></script>
</body></html>
